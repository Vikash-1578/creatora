name: Android debug build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK, run unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --continue --stacktrace

      # Room writes app/schemas/ during the build; schemas must be committed so future migrations work.
      - name: Check Room schemas are committed
        if: success() || failure()
        run: |
          changes=$(git status --porcelain app/schemas)
          if [ -n "$changes" ]; then
            echo "::error::Room schema changed but is not committed. Commit these files:"
            echo "$changes"
            git ls-files --others --modified app/schemas | while read -r f; do echo "===== $f"; cat "$f"; done
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: creatora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
