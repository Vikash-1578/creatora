name: Android debug build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Firebase config comes from a repository secret. Without it the app still builds (cloud features off).
      - name: Write google-services.json (if the secret exists)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written from the secret"
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without Firebase"
          fi

      - name: Show the debug signing SHA-1 (register it in Firebase)
        run: keytool -list -v -keystore app/debug.keystore -storepass android | grep -E "SHA1|SHA256"

      # Instagram, Facebook and TikTok sign-in settings come from repository secrets (see docs/platform-setup.md).
      # Unset secrets are empty and leave that platform's sign-in unset. They end up inside the APK this job uploads.
      - name: Build debug APK, run unit tests and lint
        env:
          OAUTH_REDIRECT_URL: ${{ secrets.OAUTH_REDIRECT_URL }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_CONFIG_ID: ${{ secrets.FACEBOOK_CONFIG_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --continue --stacktrace

      # Room writes app/schemas/ during the build; schemas must be committed so future migrations work.
      - name: Check Room schemas are committed
        if: success() || failure()
        run: |
          changes=$(git status --porcelain app/schemas)
          if [ -n "$changes" ]; then
            echo "::error::Room schema changed but is not committed. Commit these files:"
            echo "$changes"
            git ls-files --others --modified app/schemas | while read -r f; do echo "===== $f"; cat "$f"; done
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      # Pictures of the main screens in light and dark, drawn by a unit test with sample numbers (not from a phone).
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: creatora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Starts the debug app on an emulator and walks the first onboarding steps, so a crash on launch is caught before merging.
  smoke:
    name: Smoke test on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json (if the secret exists)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
